   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8b8a85" x="19.2" y="83.994984" transform="rotate(-0 19.2 83.994984)">sequence evidence</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="61.44" y="29.314828" transform="rotate(-0 61.44 29.314828)">RCSB PDB</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(28.265641 38.452031)">636 entries with bare</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(38.451078 45.630227)">rare-earth ions</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(26.452141 52.808422)">(Gd, Yb, Tb, … Nd, Dy)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="160.32" y="29.314828" transform="rotate(-0 160.32 29.314828)">Parse sites</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(123.529781 38.782375)">first-shell O/N/S ≤ 3.2 Å</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(135.088422 45.96057)">assembly-aware</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(132.359453 53.138766)">3,375 site records</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="259.2" y="29.314828" transform="rotate(-0 259.2 29.314828)">Curate</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(221.989344 38.452031)">62 entries read by hand</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(231.016641 45.630227)">4 natural families;</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(234.789437 52.808422)">artefact classes</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="358.08" y="29.314828" transform="rotate(-0 358.08 29.314828)">Descriptor</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(319.105734 38.452031)">coordination number ≥ 9</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(328.204719 45.630227)">refuses chelated or</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(328.081688 52.808422)">low-resolution sites</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="61.44" y="95.410828" transform="rotate(-0 61.44 95.410828)">UniProt / InterPro</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(34.978109 104.548031)">165,902 EF-hand</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(28.630859 111.726227)">sequences, &lt; 200 aa</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(30.102391 118.904422)">no family label used</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="160.32" y="95.410828" transform="rotate(-0 160.32 95.410828)">Retrieve by spacing</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(129.006609 104.548031)">4 EF loops, adjacent</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(128.416156 111.726227)">gaps 12–13 residues</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(122.330469 118.904422)">(EF_LOOP_INSTRUMENT)</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="259.2" y="95.410828" transform="rotate(-0 259.2 95.410828)">Candidates</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(237.770766 104.548031)">156 strict hits</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(220.589984 111.726227)">107 in family, 49 outside</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(222.290141 118.904422)">both controls recovered</text>
   </g>
   <g id="text_17">
