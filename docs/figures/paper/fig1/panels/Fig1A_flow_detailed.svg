   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="61.44" y="30.178828" transform="rotate(-0 61.44 30.178828)">RCSB PDB</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(28.265641 39.316031)">636 entries with bare</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(38.451078 46.494227)">rare-earth ions</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(26.452141 53.672422)">(Gd, Yb, Tb, … Nd, Dy)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="160.32" y="30.178828" transform="rotate(-0 160.32 30.178828)">Parse sites</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(123.529781 39.646375)">first-shell O/N/S ≤ 3.2 Å</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(135.088422 46.82457)">assembly-aware</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(132.359453 54.002766)">3,375 site records</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="259.2" y="30.178828" transform="rotate(-0 259.2 30.178828)">Curate</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(221.989344 39.316031)">62 entries read by hand</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(231.016641 46.494227)">4 natural families;</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(234.789437 53.672422)">artefact classes</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="358.08" y="30.178828" transform="rotate(-0 358.08 30.178828)">Descriptor</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(319.105734 39.316031)">coordination number ≥ 9</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(328.204719 46.494227)">refuses chelated or</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(328.081688 53.672422)">low-resolution sites</text>
   </g>
   <g id="text_11">
