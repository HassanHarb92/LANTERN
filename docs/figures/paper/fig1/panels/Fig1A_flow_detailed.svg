   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(34.978109 112.756031)">165,902 EF-hand</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(28.630859 119.934227)">sequences, &lt; 200 aa</text>
